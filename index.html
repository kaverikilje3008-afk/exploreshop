<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f2">
  <title>Explore Shop</title>

  <style>
    :root {
      --bg: #f5f7f2;
      --sidebar: #fff;
      --panel: #fff;
      --ink: #1d2b25;
      --muted: #75827b;
      --green: #39764d;
      --green-dark: #245b38;
      --green-soft: #eaf3e9;
      --line: #e2e8e1;
      --shadow: 0 12px 35px rgba(33, 58, 39, .07);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      width: 255px;
      padding: 27px 18px;
      background: var(--sidebar);
      border-right: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 23px;
      font-weight: 780;
      letter-spacing: -.045em;
    }

    .brand-mark {
      display: grid;
      width: 43px;
      height: 43px;
      place-items: center;
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(145deg, #62a878, #34784c);
      box-shadow: 0 8px 24px #39764d2b;
    }

    .brand b { color: var(--green); }

    .menu-label, .eyebrow {
      color: var(--green);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .menu-label { margin: 58px 0 13px 9px; }

    .category-nav { display: grid; gap: 7px; }

    .category-button {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 12px;
      text-align: left;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 9px;
      transition: .2s;
    }

    .category-button:hover {
      color: var(--ink);
      background: #f4f7f2;
    }

    .category-button.active {
      color: var(--green-dark);
      background: var(--green-soft);
      border-color: #d4e7d5;
      box-shadow: inset 3px 0 var(--green);
    }

    .category-icon {
      width: 22px;
      color: var(--green);
      text-align: center;
    }

    .side-bottom {
      margin-top: auto;
      padding: 18px 4px 0;
      color: var(--muted);
      font-size: 12px;
      border-top: 1px solid var(--line);
    }

    .side-bottom p { margin: 0 0 8px; }
    .side-bottom a { color: var(--green); }

    .main {
      min-height: 100vh;
      margin-left: 255px;
      padding: 32px clamp(22px, 4vw, 58px) 50px;
    }

    .main-inner { max-width: 1450px; margin: 0 auto; }

    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 30px;
    }

    h1 {
      margin: 8px 0 5px;
      font-size: clamp(32px, 3.2vw, 43px);
      line-height: 1.1;
      letter-spacing: -.045em;
    }

    .subtitle { margin: 0; color: var(--muted); }

    .date-pill {
      margin-top: 4px;
      padding: 11px 15px;
      color: #516057;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 9px;
      font-size: 13px;
      white-space: nowrap;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .stat-card {
      padding: 20px 23px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .stat-name { color: var(--muted); font-size: 13px; }

    .stat-value {
      margin-top: 9px;
      color: var(--green);
      font-size: 30px;
      font-weight: 750;
    }

    .catalog {
      padding: 25px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .catalog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
    }

    .catalog-head h2 {
      margin: 5px 0 0;
      font-size: 25px;
      letter-spacing: -.035em;
    }

    .catalog-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .search {
      width: min(290px, 30vw);
      height: 43px;
      padding: 0 13px;
      color: var(--ink);
      background: #fbfcfa;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
    }

    .search:focus, select:focus {
      border-color: #70a47b;
      outline: 3px solid #39764d1c;
    }

    select {
      min-height: 43px;
      padding: 0 11px;
      color: var(--ink);
      background: #fbfcfa;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 17px;
      padding: 14px;
      background: #f8faf7;
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
    }

    .filter-label { color: var(--muted); font-size: 12px; }

    .price-control {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 220px;
    }

    input[type="range"] {
      width: 145px;
      accent-color: var(--green);
    }

    .price-value {
      min-width: 72px;
      color: var(--green-dark);
      font-size: 12px;
      font-weight: 700;
      text-align: right;
    }

    .results-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 18px 1px 13px;
      color: var(--muted);
      font-size: 13px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 15px;
    }

    .product-card {
      overflow: hidden;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 11px;
      transition: transform .2s, box-shadow .2s, border-color .2s;
    }

    .product-card:hover {
      transform: translateY(-3px);
      border-color: #b9d3bc;
      box-shadow: var(--shadow);
    }

    .product-image-wrap {
      position: relative;
      height: 190px;
      overflow: hidden;
      background: #edf2eb;
    }

    .product-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .35s;
    }

    .product-card:hover .product-image { transform: scale(1.04); }

    .image-fallback {
      display: none;
      position: absolute;
      inset: 0;
      place-items: center;
      color: var(--green);
      font-size: 44px;
      background: linear-gradient(135deg, #edf4eb, #dceade);
    }

    .image-fallback.show { display: grid; }

    .product-info { padding: 15px; }

    .product-category {
      color: var(--green);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .product-name {
      margin: 6px 0;
      font: 20px/1.2 Georgia, "Times New Roman", serif;
    }

    .product-description {
      min-height: 38px;
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .rating { color: #b98219; font-size: 12px; }
    .rating span { color: var(--muted); }

    .product-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 11px;
    }

    .product-price { font-size: 17px; font-weight: 760; }
    .stock { color: var(--green); font-size: 10px; }

    .empty {
      grid-column: 1 / -1;
      padding: 45px 20px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: 10px;
    }

    @media (max-width: 1100px) {
      .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .catalog-head { align-items: flex-start; flex-direction: column; }
      .catalog-controls { width: 100%; }
      .search { width: 100%; flex: 1; }
    }

    @media (max-width: 760px) {
      .sidebar {
        position: relative;
        width: 100%;
        padding: 13px 17px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .brand { font-size: 21px; }
      .brand-mark { width: 38px; height: 38px; }
      .menu-label, .side-bottom { display: none; }

      .category-nav {
        display: flex;
        gap: 6px;
        margin-top: 13px;
        overflow-x: auto;
      }

      .category-button {
        width: auto;
        flex: 0 0 auto;
        padding: 9px 11px;
        white-space: nowrap;
      }

      .main { margin: 0; padding: 23px 16px 35px; }
      .stats { gap: 8px; }
      .stat-card { padding: 15px 12px; }
      .stat-name { font-size: 11px; }
      .stat-value { font-size: 25px; }
      .catalog { padding: 17px 13px; }
      .filter-row { align-items: flex-start; }
      .filter-group { width: 100%; justify-content: space-between; }
    }

    @media (max-width: 480px) {
      .page-head { display: block; }
      .date-pill { display: inline-block; margin-top: 12px; }
      .stats { grid-template-columns: 1fr; }
      .stat-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .stat-value { margin: 0; }
      .product-grid { grid-template-columns: 1fr; }
      .product-image-wrap { height: 215px; }
      .catalog-controls { align-items: stretch; flex-direction: column; }
      .search { min-height: 43px; }
      .price-control { min-width: 0; width: 100%; }
      input[type="range"] { flex: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <aside class="sidebar">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span>Explore <b>Shop</b></span>
    </a>

    <div class="menu-label">Categories</div>

    <nav class="category-nav" aria-label="Product categories">
      <button class="category-button active" data-category="all">
        <span class="category-icon">▦</span>All Products
      </button>
      <button class="category-button" data-category="electronics">
        <span class="category-icon">▣</span>Electronics
      </button>
      <button class="category-button" data-category="home">
        <span class="category-icon">⌂</span>Home & Living
      </button>
      <button class="category-button" data-category="lifestyle">
        <span class="category-icon">◇</span>Lifestyle
      </button>
    </nav>

    <div class="side-bottom">
      <p>Thoughtful picks for everyday life.</p>
      <a href="index.html">← Back to portfolio</a>
    </div>
  </aside>

  <main class="main">
    <div class="main-inner">
      <header class="page-head">
        <div>
          <div class="eyebrow">Curated collection</div>
          <h1>Explore Shop</h1>
          <p class="subtitle">Browse, filter, and find something you’ll love.</p>
        </div>
        <div class="date-pill" id="today-date"></div>
      </header>

      <section class="stats" aria-label="Catalog summary">
        <article class="stat-card">
          <div class="stat-name">Products in catalog</div>
          <div class="stat-value" id="product-total">0</div>
        </article>
        <article class="stat-card">
          <div class="stat-name">Categories</div>
          <div class="stat-value">3</div>
        </article>
        <article class="stat-card">
          <div class="stat-name">Starting from</div>
          <div class="stat-value" id="starting-price">₹0</div>
        </article>
      </section>

      <section class="catalog" aria-labelledby="catalog-title">
        <div class="catalog-head">
          <div>
            <div class="eyebrow">Find your favorite</div>
            <h2 id="catalog-title">Product Listing</h2>
          </div>

          <div class="catalog-controls">
            <input
              class="search"
              id="search"
              type="search"
              placeholder="Search products..."
              aria-label="Search products"
            >

            <select id="sort" aria-label="Sort products">
              <option value="featured">Sort: Featured</option>
              <option value="price-low">Price: Low to high</option>
              <option value="price-high">Price: High to low</option>
              <option value="rating">Top rated</option>
            </select>
          </div>
        </div>

        <div class="filter-row">
          <div class="filter-group">
            <label class="filter-label" for="category-select">Category</label>
            <select id="category-select">
              <option value="all">All categories</option>
              <option value="electronics">Electronics</option>
              <option value="home">Home & Living</option>
              <option value="lifestyle">Lifestyle</option>
            </select>
          </div>

          <div class="filter-group price-control">
            <label class="filter-label" for="max-price">Maximum price</label>
            <input id="max-price" type="range" min="299" max="25000" step="100" value="25000">
            <span class="price-value" id="price-value">₹25,000</span>
          </div>

          <div class="filter-group">
            <label class="filter-label" for="min-rating">Rating</label>
            <select id="min-rating">
              <option value="0">Any rating</option>
              <option value="4">4 stars & up</option>
              <option value="4.5">4.5 stars & up</option>
            </select>
          </div>
        </div>

        <div class="results-line">
          <span id="result-count" aria-live="polite"></span>
          <span>Prices shown in Indian rupees</span>
        </div>

        <div class="product-grid" id="product-grid"></div>
      </section>
    </div>
  </main>

  <script>
    (() => {
      const products = [
        {
          name: "Studio Headphones",
          category: "electronics",
          price: 7499,
          rating: 4.8,
          icon: "🎧",
          description: "Comfortable sound for focused work.",
          image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=900&q=85"
        },
        {
          name: "Minimal Desk Lamp",
          category: "home",
          price: 3299,
          rating: 4.4,
          icon: "💡",
          description: "Warm light with a clean, simple shape.",
          image: "https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=900&q=85"
        },
        {
          name: "Everyday Backpack",
          category: "lifestyle",
          price: 4599,
          rating: 4.7,
          icon: "🎒",
          description: "A practical carry for work and weekends.",
          image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=900&q=85"
        },
        {
          name: "Wireless Speaker",
          category: "electronics",
          price: 5999,
          rating: 4.6,
          icon: "🔊",
          description: "Compact audio for your favorite room.",
          image: "https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?auto=format&fit=crop&w=900&q=85"
        },
        {
          name: "Ceramic Planter",
          category: "home",
          price: 899,
          rating: 4.2,
          icon: "🪴",
          description: "A little green detail for your desk.",
          image: "https://images.unsplash.com/photo-1485955900006-10f4d324d411?auto=format&fit=crop&w=900&q=85"
        },
        {
          name: "Classic Wristwatch",
          category: "lifestyle",
          price: 8999,
          rating: 4.5,
          icon: "⌚",
          description: "A timeless style for everyday wear.",
          image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=900&q=85"
        },
        {
          name: "Travel Mug",
          category: "home",
          price: 699,
          rating: 4.1,
          icon: "☕",
          description: "Keep your daily drink close at hand.",
          image: "https://images.unsplash.com/photo-1514228742587-6b1558fcca3d?auto=format&fit=crop&w=900&q=85"
        },
        {
          name: "Mechanical Keyboard",
          category: "electronics",
          price: 6299,
          rating: 4.9,
          icon: "⌨️",
          description: "Tactile keys for a satisfying setup.",
          image: "https://images.unsplash.com/photo-1595225476474-87563907a212?auto=format&fit=crop&w=900&q=85"
        },
        {
          name: "Soft Throw Blanket",
          category: "home",
          price: 2799,
          rating: 4.3,
          icon: "🧶",
          description: "A cozy layer for quiet evenings.",
          image: "https://images.unsplash.com/photo-1600369671236-e74521d4b6ad?auto=format&fit=crop&w=900&q=85"
        }
      ];

      const rupees = new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: "INR",
        maximumFractionDigits: 0
      });

      let activeCategory = "all";

      const grid = document.querySelector("#product-grid");
      const categorySelect = document.querySelector("#category-select");
      const maxPrice = document.querySelector("#max-price");
      const minRating = document.querySelector("#min-rating");
      const search = document.querySelector("#search");
      const sort = document.querySelector("#sort");

      document.querySelector("#today-date").textContent =
        new Intl.DateTimeFormat("en-IN", {
          weekday: "short",
          day: "2-digit",
          month: "long",
          year: "numeric"
        }).format(new Date());

      document.querySelector("#product-total").textContent = products.length;
      document.querySelector("#starting-price").textContent =
        rupees.format(Math.min(...products.map(product => product.price)));

      function categoryName(category) {
        return {
          electronics: "Electronics",
          home: "Home & Living",
          lifestyle: "Lifestyle"
        }[category] || category;
      }

      function makeProductCard(product) {
        const card = document.createElement("article");
        card.className = "product-card";

        const imageWrap = document.createElement("div");
        imageWrap.className = "product-image-wrap";

        const image = document.createElement("img");
        image.className = "product-image";
        image.src = product.image;
        image.alt = product.name;
        image.loading = "lazy";

        const fallback = document.createElement("div");
        fallback.className = "image-fallback";
        fallback.textContent = product.icon;
        fallback.setAttribute("aria-hidden", "true");

        image.addEventListener("error", () => {
          image.style.display = "none";
          fallback.classList.add("show");
        });

        imageWrap.append(image, fallback);

        const info = document.createElement("div");
        info.className = "product-info";

        const category = document.createElement("div");
        category.className = "product-category";
        category.textContent = categoryName(product.category);

        const name = document.createElement("h3");
        name.className = "product-name";
        name.textContent = product.name;

        const description = document.createElement("p");
        description.className = "product-description";
        description.textContent = product.description;

        const rating = document.createElement("div");
        rating.className = "rating";
        rating.textContent = `★ ${product.rating.toFixed(1)} `;

        const ratingOutOf = document.createElement("span");
        ratingOutOf.textContent = "/ 5";
        rating.append(ratingOutOf);

        const foot = document.createElement("div");
        foot.className = "product-foot";

        const price = document.createElement("span");
        price.className = "product-price";
        price.textContent = rupees.format(product.price);

        const stock = document.createElement("span");
        stock.className = "stock";
        stock.textContent = "In stock";

        foot.append(price, stock);
        info.append(category, name, description, rating, foot);
        card.append(imageWrap, info);

        return card;
      }

      function render() {
        document.querySelector("#price-value").textContent =
          rupees.format(Number(maxPrice.value));

        const searchTerm = search.value.trim().toLocaleLowerCase();

        let visibleProducts = products.filter(product => {
          const categoryMatches =
            activeCategory === "all" || product.category === activeCategory;

          const selectMatches =
            categorySelect.value === "all" ||
            product.category === categorySelect.value;

          const priceMatches = product.price <= Number(maxPrice.value);
          const ratingMatches = product.rating >= Number(minRating.value);

          const searchableText =
            `${product.name} ${product.description} ${categoryName(product.category)}`
              .toLocaleLowerCase();

          return categoryMatches &&
            selectMatches &&
            priceMatches &&
            ratingMatches &&
            searchableText.includes(searchTerm);
        });

        if (sort.value === "price-low") {
          visibleProducts.sort((a, b) => a.price - b.price);
        } else if (sort.value === "price-high") {
          visibleProducts.sort((a, b) => b.price - a.price);
        } else if (sort.value === "rating") {
          visibleProducts.sort((a, b) => b.rating - a.rating);
        }

        document.querySelector("#result-count").textContent =
          `Showing ${visibleProducts.length} of ${products.length} products`;

        grid.replaceChildren();

        if (!visibleProducts.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent =
            "No products match those filters. Try changing your search.";
          grid.append(empty);
          return;
        }

        visibleProducts.forEach(product => {
          grid.append(makeProductCard(product));
        });
      }

      document.querySelectorAll(".category-button").forEach(button => {
        button.addEventListener("click", () => {
          activeCategory = button.dataset.category;
          categorySelect.value = "all";

          document.querySelectorAll(".category-button").forEach(item => {
            item.classList.toggle("active", item === button);
          });

          render();
        });
      });

      categorySelect.addEventListener("change", () => {
        activeCategory = "all";

        document.querySelectorAll(".category-button").forEach(button => {
          button.classList.toggle(
            "active",
            button.dataset.category === "all"
          );
        });

        render();
      });

      maxPrice.addEventListener("input", render);
      minRating.addEventListener("change", render);
      search.addEventListener("input", render);
      sort.addEventListener("change", render);

      render();
    })();
  </script>
</body>
</html>
