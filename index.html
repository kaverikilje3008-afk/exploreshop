<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071522">
  <title>Explore Shop</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #071522;
      --sidebar: #091a28;
      --ink: #edf5f2;
      --muted: #a6b9bd;
      --green: #a8ed75;
      --line: rgba(217, 242, 229, .13);
      --shadow: 0 20px 60px rgba(1, 9, 15, .25);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      width: 255px;
      padding: 27px 18px;
      background: var(--sidebar);
      border-right: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 23px;
      font-weight: 780;
      letter-spacing: -.045em;
    }

    .brand-mark {
      display: grid;
      width: 43px;
      height: 43px;
      place-items: center;
      border-radius: 13px;
      color: #092019;
      background: linear-gradient(145deg, #b7f38b, #69bd7b);
      box-shadow: 0 8px 24px #73ba6d36;
    }

    .brand b { color: var(--green); }

    .menu-label, .eyebrow {
      color: var(--green);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .menu-label { margin: 58px 0 13px 9px; }

    .category-nav { display: grid; gap: 7px; }

    .category-button {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 12px;
      text-align: left;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 9px;
      transition: .2s;
    }

    .category-button:hover {
      color: var(--ink);
      background: #102536;
    }

    .category-button.active {
      color: var(--ink);
      background: linear-gradient(105deg, #17392f, #112b31);
      border-color: #a8ed752c;
      box-shadow: inset 3px 0 var(--green);
    }

    .category-icon {
      width: 22px;
      color: var(--green);
      text-align: center;
    }

    .side-bottom {
      margin-top: auto;
      padding: 18px 4px 0;
      color: var(--muted);
      font-size: 12px;
      border-top: 1px solid var(--line);
    }

    .side-bottom p { margin: 0 0 8px; }
    .side-bottom a { color: var(--green); }

    .main {
      min-height: 100vh;
      margin-left: 255px;
      padding: 32px clamp(22px, 4vw, 58px) 50px;
    }

    .main-inner { max-width: 1450px; margin: 0 auto; }

    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 30px;
    }

    h1 {
      margin: 8px 0 5px;
      font-size: clamp(32px, 3.2vw, 43px);
      line-height: 1.1;
      letter-spacing: -.045em;
    }

    .subtitle { margin: 0; color: var(--muted); }

    .date-pill {
      margin-top: 4px;
      padding: 11px 15px;
      color: #c5d6d4;
      background: #0c1d2b;
      border: 1px solid var(--line);
      border-radius: 9px;
      font-size: 13px;
      white-space: nowrap;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .stat-card {
      padding: 20px 23px;
      background: linear-gradient(145deg, #102838, #0c1d2b);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .stat-name { color: var(--muted); font-size: 13px; }

    .stat-value {
      margin-top: 9px;
      color: var(--green);
      font-size: 30px;
      font-weight: 750;
    }

    .catalog {
      padding: 25px;
      background: linear-gradient(145deg, #0c1e2d, #0b1b29);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .catalog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
    }

    .catalog-head h2 {
      margin: 5px 0 0;
      font-size: 25px;
      letter-spacing: -.035em;
    }

    .catalog-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .search {
      width: min(290px, 30vw);
      height: 43px;
      padding: 0 13px;
      color: var(--ink);
      background: #091a27;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
    }

    .search:focus, select:focus {
      border-color: #a8ed7580;
      outline: 2px solid #a8ed7520;
    }

    select {
      min-height: 43px;
      padding: 0 11px;
      color: var(--ink);
      background: #091a27;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 17px;
      padding: 14px;
      background: #091a27;
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
    }

    .filter-label { color: var(--muted); font-size: 12px; }

    .price-control {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 220px;
    }

    input[type="range"] {
      width: 145px;
      accent-color: var(--green);
    }

    .price-value {
      min-width: 70px;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      text-align: right;
    }

      display: flex;
      align-items: center;
      justify-content: space
